name: Repair editor unicode

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair invalid escapes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/creator/EditorWedding.jsx')
          text = path.read_text(encoding='utf-8')
          fixed = text.replace("\\'", "'")
          if fixed == text:
              raise SystemExit('No invalid escape found')
          path.write_text(fixed, encoding='utf-8')
          PY
          npm install --progress=false
          npm run build
      - name: Commit repair and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/creator/EditorWedding.jsx
          git rm .github/workflows/repair-editor-unicode.yml
          git commit -m "fix: repair editor unicode escapes"
          git push
