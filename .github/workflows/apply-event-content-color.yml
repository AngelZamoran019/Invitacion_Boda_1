name: Apply event content color

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aplicar controles de contenido color en Evento
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          editor = Path('src/creator/EditorWedding.jsx')
          text = editor.read_text(encoding='utf-8')
          old = next((line for line in text.splitlines() if line.strip().startswith("case 'event': return")), None)
          if not old:
              raise SystemExit('No se encontró el bloque de Evento en EditorWedding.jsx')
          new = '''      case 'event': { const event = project.event || {}; return <div className="editor-grid"><CoverTextEditor label="Título de sección" value={event.sectionTitle ?? 'El gran día'} onChange={(v) => set('event.sectionTitle', v)} color={event.sectionTitleColor} mode={event.sectionTitleMode} gradient={event.sectionTitleGradient} size={event.sectionTitleSize} font={event.sectionTitleFont} positionY={event.sectionTitlePositionY} set={set} prefix="event.sectionTitle" defaultSize={11} /><CoverTextEditor label="Título de ceremonia" value={event.ceremonyTitle ?? 'Ceremonia'} onChange={(v) => set('event.ceremonyTitle', v)} color={event.ceremonyTitleColor} mode={event.ceremonyTitleMode} gradient={event.ceremonyTitleGradient} size={event.ceremonyTitleSize} font={event.ceremonyTitleFont} positionY={event.ceremonyTitlePositionY} set={set} prefix="event.ceremonyTitle" defaultSize={12} /><CoverTextEditor label="Título de recepción" value={event.receptionTitle ?? 'Recepción'} onChange={(v) => set('event.receptionTitle', v)} color={event.receptionTitleColor} mode={event.receptionTitleMode} gradient={event.receptionTitleGradient} size={event.receptionTitleSize} font={event.receptionTitleFont} positionY={event.receptionTitlePositionY} set={set} prefix="event.receptionTitle" defaultSize={12} /><CoverTextEditor label="Fecha" value={event.date ?? ''} onChange={(v) => set('event.date', v)} placeholder="Ej. 24 de octubre de 2026, sábado 24/10, etc." color={event.dateColor} mode={event.dateMode} gradient={event.dateGradient} size={event.dateSize} font={event.dateFont} positionY={event.datePositionY} set={set} prefix="event.date" defaultSize={32} /><CoverTextEditor label="Hora" value={event.time ?? ''} onChange={(v) => set('event.time', v)} placeholder="18:00" color={event.timeColor} mode={event.timeMode} gradient={event.timeGradient} size={event.timeSize} font={event.timeFont} positionY={event.timePositionY} set={set} prefix="event.time" defaultSize={12} /><CoverTextEditor label="Dirección de ceremonia" value={event.ceremonyAddress ?? ''} onChange={(v) => set('event.ceremonyAddress', v)} color={event.ceremonyAddressColor} mode={event.ceremonyAddressMode} gradient={event.ceremonyAddressGradient} size={event.ceremonyAddressSize} font={event.ceremonyAddressFont} positionY={event.ceremonyAddressPositionY} set={set} prefix="event.ceremonyAddress" defaultSize={12} /><TextField label="Google Maps ceremonia" value={event.ceremonyMapsUrl} onChange={(v) => set('event.ceremonyMapsUrl', v)} placeholder="https://maps.google.com/..." /><CoverTextEditor label="Dirección de recepción" value={event.receptionAddress ?? ''} onChange={(v) => set('event.receptionAddress', v)} color={event.receptionAddressColor} mode={event.receptionAddressMode} gradient={event.receptionAddressGradient} size={event.receptionAddressSize} font={event.receptionAddressFont} positionY={event.receptionAddressPositionY} set={set} prefix="event.receptionAddress" defaultSize={12} /><TextField label="Google Maps recepción" value={event.receptionMapsUrl} onChange={(v) => set('event.receptionMapsUrl', v)} placeholder="https://maps.google.com/..." /></div> }'''
          text = text.replace(old, new, 1)
          editor.write_text(text, encoding='utf-8')

          schema = Path('src/data/weddingSchema.js')
          text = schema.read_text(encoding='utf-8')
          old_event = "event:{sectionTitle:'El gran día',date:'',time:'',ceremonyTitle:'Ceremonia',ceremonyVenue:'',ceremonyAddress:'',ceremonyMapsUrl:'',receptionTitle:'Recepción',receptionVenue:'',receptionAddress:'',receptionMapsUrl:''}"
          new_event = "event:{sectionTitle:'El gran día',sectionTitleColor:'#c9a86a',sectionTitleMode:'solid',sectionTitleGradient:'',sectionTitleSize:11,sectionTitleFont:'Arial',sectionTitlePositionY:0,date:'',dateColor:'#ffffff',dateMode:'solid',dateGradient:'',dateSize:32,dateFont:\"'Playfair Display',serif\",datePositionY:0,time:'',timeColor:'#ffffff',timeMode:'solid',timeGradient:'',timeSize:12,timeFont:'Arial',timePositionY:0,ceremonyTitle:'Ceremonia',ceremonyTitleColor:'#ffffff',ceremonyTitleMode:'solid',ceremonyTitleGradient:'',ceremonyTitleSize:12,ceremonyTitleFont:'Arial',ceremonyTitlePositionY:0,ceremonyVenue:'',ceremonyAddress:'',ceremonyAddressColor:'#ffffff',ceremonyAddressMode:'solid',ceremonyAddressGradient:'',ceremonyAddressSize:12,ceremonyAddressFont:'Arial',ceremonyAddressPositionY:0,ceremonyMapsUrl:'',receptionTitle:'Recepción',receptionTitleColor:'#ffffff',receptionTitleMode:'solid',receptionTitleGradient:'',receptionTitleSize:12,receptionTitleFont:'Arial',receptionTitlePositionY:0,receptionVenue:'',receptionAddress:'',receptionAddressColor:'#ffffff',receptionAddressMode:'solid',receptionAddressGradient:'',receptionAddressSize:12,receptionAddressFont:'Arial',receptionAddressPositionY:0,receptionMapsUrl:''}"
          if old_event not in text:
              raise SystemExit('No se encontró el objeto event en weddingSchema.js')
          text = text.replace(old_event, new_event, 1)
          schema.write_text(text, encoding='utf-8')

          output = Path('src/export/weddingOutput.js')
          text = output.read_text(encoding='utf-8')
          marker = 'const applyWeddingFonts = (html, project) => {'
          if marker not in text:
              raise SystemExit('No se encontró el punto de inserción en weddingOutput.js')
          helper = r'''const applyEventContentStyles = (html, project) => {
  const event = project?.event || {}
  const safeColor = (value, fallback = '#ffffff') => /^#[0-9a-fA-F]{6}$/.test(String(value || '')) ? String(value) : fallback
  const safeGradient = (value) => typeof value === 'string' && value.includes('gradient(') && (value.match(/#[0-9a-fA-F]{6}/g) || []).length >= 2 ? value : ''
  const safeSize = (value, fallback) => { const number = Number(value); return Number.isFinite(number) && number > 0 ? number : fallback }
  const safePosition = (value) => { const number = Number(value); return Number.isFinite(number) ? Math.max(-300, Math.min(300, number)) : 0 }
  const fontFamily = (value, fallback) => getWeddingFontFamily(value || fallback)
  const paint = (mode, color, gradient) => {
    const safeGradientValue = safeGradient(gradient)
    if (mode === 'gradient' && safeGradientValue) return 'background:' + safeGradientValue + '!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important;-webkit-text-fill-color:transparent!important;'
    const safeColorValue = safeColor(color)
    return 'background:none!important;color:' + safeColorValue + '!important;-webkit-text-fill-color:' + safeColorValue + '!important;'
  }
  const style = (prefix, fallbackColor, fallbackSize, fallbackFont) => paint(event[prefix + 'Mode'], event[prefix + 'Color'], event[prefix + 'Gradient']) + 'font-family:' + fontFamily(event[prefix + 'Font'], fallbackFont) + '!important;font-size:' + safeSize(event[prefix + 'Size'], fallbackSize) + 'px!important;position:relative!important;top:' + safePosition(event[prefix + 'PositionY']) + 'px!important;'
  const source = String(html || '')
  const sectionTitle = escapeHtml(event.sectionTitle || 'El gran día')
  const sections = source.match(/<section\s+class=["']section["'][^>]*>[\s\S]*?<\/section>/gi) || []
  const escapedTitle = sectionTitle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
  const target = sections.find((section) => new RegExp("<p\\s+class=[\"']eyebrow[\"'][^>]*>\\s*" + escapedTitle + "\\s*</p>", 'i').test(section))
  if (!target) return source
  const marked = source.replace(target, target.replace(/^<section\s+class=["']section["']/, '<section class="section event-content-section"'))
  const css = '<style id="wedding-event-content-styles">' +
    '.phone>.section.event-content-section>.eyebrow{' + style('sectionTitle','#c9a86a',11,'Arial') + '}' +
    '.phone>.section.event-content-section>h2{' + style('date','#ffffff',32,"'Playfair Display',serif") + '}' +
    '.phone>.section.event-content-section>h2 + p{' + style('time','#ffffff',12,'Arial') + '}' +
    '.phone>.section.event-content-section>.event-card:nth-of-type(1)>strong{' + style('ceremonyTitle','#ffffff',12,'Arial') + '}' +
    '.phone>.section.event-content-section>.event-card:nth-of-type(2)>strong{' + style('receptionTitle','#ffffff',12,'Arial') + '}' +
    '.phone>.section.event-content-section>.event-card:nth-of-type(1)>small{' + style('ceremonyAddress','#ffffff',12,'Arial') + '}' +
    '.phone>.section.event-content-section>.event-card:nth-of-type(2)>small{' + style('receptionAddress','#ffffff',12,'Arial') + '}' +
    '</style>'
  if (marked.includes('id="wedding-event-content-styles"')) return marked.replace(/<style id="wedding-event-content-styles">[\s\S]*?<\/style>/i, css)
  return marked.replace('</head>', css + '</head>')
}

'''
          text = text.replace(marker, helper + marker, 1)
          call = '  const withStoryContentStyles = applyStoryContentStyles(withCoupleContentStyles, project)\n'
          if call not in text:
              raise SystemExit('No se encontró la cadena de estilos de Story en weddingOutput.js')
          text = text.replace(call, call + '  const withEventContentStyles = applyEventContentStyles(withStoryContentStyles, project)\n', 1)
          text = text.replace('  const withFonts = applyWeddingFonts(withStoryContentStyles, project)', '  const withFonts = applyWeddingFonts(withEventContentStyles, project)', 1)
          output.write_text(text, encoding='utf-8')
          PY
          npm install
          npm run build
      - name: Guardar cambios y limpiar workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/creator/EditorWedding.jsx src/data/weddingSchema.js src/export/weddingOutput.js
          git rm -f .github/workflows/apply-event-content-color.yml
          git commit -m 'Habilitar contenido color en Evento'
          git push
