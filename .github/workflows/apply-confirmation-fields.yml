name: Apply confirmation field controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply confirmation field controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch confirmation fields
        run: |
          python - <<'PY'
          from pathlib import Path

          # Editor: add four editable confirmation field labels with full content controls.
          p=Path('src/creator/EditorWedding.jsx')
          s=p.read_text()
          old='''<CoverTextEditor label="Mensaje" value={confirmation.message ?? 'Ayúdanos confirmando tu asistencia'} onChange={(v) => set('confirmation.message', v)} multiline color={confirmation.messageColor} mode={confirmation.messageMode} gradient={confirmation.messageGradient} size={confirmation.messageSize} font={confirmation.messageFont} positionY={confirmation.messagePositionY} set={set} prefix="confirmation.message" defaultSize={16} /><TextField label="URL de confirmación"'''
          new='''<CoverTextEditor label="Mensaje" value={confirmation.message ?? 'Ayúdanos confirmando tu asistencia'} onChange={(v) => set('confirmation.message', v)} multiline color={confirmation.messageColor} mode={confirmation.messageMode} gradient={confirmation.messageGradient} size={confirmation.messageSize} font={confirmation.messageFont} positionY={confirmation.messagePositionY} set={set} prefix="confirmation.message" defaultSize={16} /><CoverTextEditor label="Nombre" value={confirmation.nameLabel ?? 'Nombre'} onChange={(v) => set('confirmation.nameLabel', v)} color={confirmation.nameLabelColor} mode={confirmation.nameLabelMode} gradient={confirmation.nameLabelGradient} size={confirmation.nameLabelSize} font={confirmation.nameLabelFont} positionY={confirmation.nameLabelPositionY} set={set} prefix="confirmation.nameLabel" defaultSize={12} /><CoverTextEditor label="Asistencia" value={confirmation.attendanceLabel ?? '¿Asistiras?'} onChange={(v) => set('confirmation.attendanceLabel', v)} color={confirmation.attendanceLabelColor} mode={confirmation.attendanceLabelMode} gradient={confirmation.attendanceLabelGradient} size={confirmation.attendanceLabelSize} font={confirmation.attendanceLabelFont} positionY={confirmation.attendanceLabelPositionY} set={set} prefix="confirmation.attendanceLabel" defaultSize={12} /><CoverTextEditor label="Num de invitados" value={confirmation.guestsLabel ?? 'Numero de invitados'} onChange={(v) => set('confirmation.guestsLabel', v)} color={confirmation.guestsLabelColor} mode={confirmation.guestsLabelMode} gradient={confirmation.guestsLabelGradient} size={confirmation.guestsLabelSize} font={confirmation.guestsLabelFont} positionY={confirmation.guestsLabelPositionY} set={set} prefix="confirmation.guestsLabel" defaultSize={12} /><CoverTextEditor label="Mensajes" value={confirmation.messageFieldLabel ?? 'Mensaje (Opcional)'} onChange={(v) => set('confirmation.messageFieldLabel', v)} color={confirmation.messageFieldLabelColor} mode={confirmation.messageFieldLabelMode} gradient={confirmation.messageFieldLabelGradient} size={confirmation.messageFieldLabelSize} font={confirmation.messageFieldLabelFont} positionY={confirmation.messageFieldLabelPositionY} set={set} prefix="confirmation.messageFieldLabel" defaultSize={12} /><TextField label="URL de confirmación"'''
          if old not in s: raise SystemExit('Editor target not found')
          p.write_text(s.replace(old,new,1))

          # Schema: defaults for the four field labels and their content styling.
          p=Path('src/data/weddingSchema.js')
          s=p.read_text()
          marker="message:'Ayúdanos confirmando tu asistencia',messageColor:'#ffffff',messageMode:'solid',messageGradient:'',messageSize:16,messageFont:'Arial',messagePositionY:0,url:''"
          insert="message:'Ayúdanos confirmando tu asistencia',messageColor:'#ffffff',messageMode:'solid',messageGradient:'',messageSize:16,messageFont:'Arial',messagePositionY:0,nameLabel:'Nombre',nameLabelColor:'#ffffff',nameLabelMode:'solid',nameLabelGradient:'',nameLabelSize:12,nameLabelFont:'Arial',nameLabelPositionY:0,attendanceLabel:'¿Asistiras?',attendanceLabelColor:'#ffffff',attendanceLabelMode:'solid',attendanceLabelGradient:'',attendanceLabelSize:12,attendanceLabelFont:'Arial',attendanceLabelPositionY:0,guestsLabel:'Numero de invitados',guestsLabelColor:'#ffffff',guestsLabelMode:'solid',guestsLabelGradient:'',guestsLabelSize:12,guestsLabelFont:'Arial',guestsLabelPositionY:0,messageFieldLabel:'Mensaje (Opcional)',messageFieldLabelColor:'#ffffff',messageFieldLabelMode:'solid',messageFieldLabelGradient:'',messageFieldLabelSize:12,messageFieldLabelFont:'Arial',messageFieldLabelPositionY:0,url:''"
          if marker not in s: raise SystemExit('Schema target not found')
          p.write_text(s.replace(marker,insert,1))

          # Export: use the configured labels in the actual invitation HTML.
          p=Path('src/export/exportWedding.js')
          s=p.read_text()
          replacements={
            '<p class="eyebrow" style="${textStyle(labelText)}">Por favor</p>':'<p class="eyebrow" style="${textStyle(labelText)}">${esc(confirmation.sectionTitle || \'Por favor\')}</p>',
            '<h2 style="${textStyle(sectionText)}">${esc(confirmation.title || \'Confirma tu asistencia\')}</h2>':'<h2 style="${textStyle(sectionText)}">${esc(confirmation.subtitle || confirmation.title || \'Confirma tu asistencia\')}</h2>',
            '<label style="${textStyle(smallText)}">Nombre<input name="name" required></label>':'<label class="rsvp-label rsvp-name-label">${esc(confirmation.nameLabel || \'Nombre\')}<input name="name" required></label>',
            '<label style="${textStyle(smallText)}">¿Asistirás?<select name="attendance" required>':'<label class="rsvp-label rsvp-attendance-label">${esc(confirmation.attendanceLabel || \'¿Asistiras?\')}<select name="attendance" required>',
            '<label style="${textStyle(smallText)}">Número de invitados<input name="guests" type="number" min="1" max="20" value="1" required></label>':'<label class="rsvp-label rsvp-guests-label">${esc(confirmation.guestsLabel || \'Numero de invitados\')}<input name="guests" type="number" min="1" max="20" value="1" required></label>',
            '<label style="${textStyle(smallText)}">Mensaje (opcional)<textarea name="message" rows="3"></textarea></label>':'<label class="rsvp-label rsvp-message-label">${esc(confirmation.messageFieldLabel || \'Mensaje (Opcional)\')}<textarea name="message" rows="3"></textarea></label>'
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'Export target not found: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/creator/EditorWedding.jsx src/data/weddingSchema.js src/export/exportWedding.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply confirmation field controls"
          git push
