name: Fix empty couple names
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix empty couple names behavior'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix editor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/creator/EditorWedding.jsx')
          s = p.read_text()
          old = "const fullNames = String(couple.displayNames || '').trim() || `${couple.name1 || 'Nombre'} ${couple.separator || 'y'} ${couple.name2 || 'Nombre'}`"
          new = "const fullNames = String(couple.displayNames ?? '')"
          if old not in s:
              raise SystemExit('Target expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/creator/EditorWedding.jsx
          git commit -m 'Fix empty couple names behavior'
          git push
