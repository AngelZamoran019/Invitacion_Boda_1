name: Fix dress code mapping

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[dress-code-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix dress code field mapping
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/export/weddingOutput.js')
          text = path.read_text(encoding='utf-8')

          old = '''  const updatedSection = target.replace(/(<p\\s+class=["']eyebrow["'][^>]*>)[\\s\\S]*?(<\\/p>)/i, `$1${sectionTitle}$2`)
    .replace(/(<h2\\b[^>]*>)[\\s\\S]*?(<\\/h2>)/i, `$1${subtitle}$2`)
    .replace(/(<div\\s+class=["']dress-card["'][^>]*>[\\s\\S]*?<span\\b[^>]*>)[\\s\\S]*?(<\\/span>)([\\s\\S]*?<strong\\b[^>]*>)[\\s\\S]*?(<\\/strong>)/i, `$1${menLabel}$2$3${menAttire}$4`)
    .replace(/(<div\\s+class=["']dress-card["'][^>]*>[\\s\\S]*?<span\\b[^>]*>)[\\s\\S]*?(<\\/span>)([\\s\\S]*?<strong\\b[^>]*>)[\\s\\S]*?(<\\/strong>)/i, `$1${womenLabel}$2$3${womenAttire}$4`)
'''

          new = '''  let cardIndex = 0
  const updatedSection = target.replace(/(<p\\s+class=["']eyebrow["'][^>]*>)[\\s\\S]*?(<\\/p>)/i, `$1${sectionTitle}$2`)
    .replace(/(<h2\\b[^>]*>)[\\s\\S]*?(<\\/h2>)/i, `$1${subtitle}$2`)
    .replace(/(<div\\s+class=["']dress-card["'][^>]*>[\\s\\S]*?<span\\b[^>]*>)[\\s\\S]*?(<\\/span>)([\\s\\S]*?<strong\\b[^>]*>)[\\s\\S]*?(<\\/strong>)/gi, (match, spanOpen, spanClose, strongOpen, strongClose) => {
      const isFirstCard = cardIndex === 0
      cardIndex += 1
      return isFirstCard
        ? `${spanOpen}${menLabel}${spanClose}${strongOpen}${menAttire}${strongClose}`
        : `${spanOpen}${womenLabel}${spanClose}${strongOpen}${womenAttire}${strongClose}`
    })
'''

          if old not in text:
              raise SystemExit('Expected dress-code block was not found; no changes made.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix and remove workflow
        run: |
          rm -f .github/workflows/fix-dress-code-mapping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/export/weddingOutput.js .github/workflows/fix-dress-code-mapping.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: map dress code fields to correct cards [dress-code-fixed]"
          git push
