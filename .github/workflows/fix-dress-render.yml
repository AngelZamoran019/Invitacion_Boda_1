name: Fix dress code renderer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[dress-render-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix dress code fields used by VP and export
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/export/exportWedding.js')
          text = path.read_text(encoding='utf-8')
          old = '''${dress.enabled ? `<section class="section"><p class="eyebrow" style="${textStyle(labelText)}">Código de vestimenta</p><h2 style="${textStyle(sectionText)}">Elegancia para celebrar</h2><div class="dress-grid"><div class="dress-card"><span style="${textStyle(smallText)}">Ellas</span><strong style="${textStyle(smallText)}">${esc(dress.women || 'Por definir')}</strong></div><div class="dress-card"><span style="${textStyle(smallText)}">Ellos</span><strong style="${textStyle(smallText)}">${esc(dress.men || 'Por definir')}</strong></div></div>${dress.note ? `<p class="text" style="${textStyle(paragraphText)}">${esc(dress.note)}</p>` : ''}</section>` : ''}'''
          new = '''${dress.enabled ? `<section class="section"><p class="eyebrow" style="${textStyle(labelText)}">${esc(dress.sectionTitle ?? 'Código de vestimenta')}</p><h2 style="${textStyle(sectionText)}">${esc(dress.subtitle ?? 'Elegancia para celebrar')}</h2><div class="dress-grid"><div class="dress-card"><span style="${textStyle(smallText)}">${esc(dress.menLabel ?? 'Hombres')}</span><strong style="${textStyle(smallText)}">${esc(dress.menAttire ?? dress.men ?? 'Por definir')}</strong></div><div class="dress-card"><span style="${textStyle(smallText)}">${esc(dress.womenLabel ?? 'Mujeres')}</span><strong style="${textStyle(smallText)}">${esc(dress.womenAttire ?? dress.women ?? 'Por definir')}</strong></div></div>${dress.note ? `<p class="text" style="${textStyle(paragraphText)}">${esc(dress.note)}</p>` : ''}</section>` : ''}'''
          if old not in text:
              raise SystemExit('Dress code renderer block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix-dress-render.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/export/exportWedding.js .github/workflows/fix-dress-render.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: sync dress code renderer fields [dress-render-fixed]"
          git push
