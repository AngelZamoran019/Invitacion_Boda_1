name: Apply event location color

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply location color
        run: |
          python - <<'PY'
          from pathlib import Path

          editor = Path('src/creator/EditorWedding.jsx')
          text = editor.read_text(encoding='utf-8')
          needle = '<TextField label="Google Maps recepción" value={event.receptionMapsUrl} onChange={(v) => set(\'event.receptionMapsUrl\', v)} placeholder="https://maps.google.com/..." />'
          insert = needle + '<div className="editor-field"><span>Color Ubicación</span><ColorPicker value={event.locationColor ?? \'#ffffff\'} onChange={(value) => set(\'event.locationColor\', value)} /></div>'
          if 'Color Ubicación' not in text:
              if needle not in text:
                  raise SystemExit('Editor target not found')
              text = text.replace(needle, insert, 1)
              editor.write_text(text, encoding='utf-8')

          schema = Path('src/data/weddingSchema.js')
          text = schema.read_text(encoding='utf-8')
          needle = "receptionMapsUrl:''},\n  countdown:"
          replacement = "receptionMapsUrl:'',locationColor:'#ffffff'},\n  countdown:"
          if 'locationColor' not in text:
              if needle not in text:
                  raise SystemExit('Schema target not found')
              text = text.replace(needle, replacement, 1)
              schema.write_text(text, encoding='utf-8')

          output = Path('src/export/exportWedding.js')
          text = output.read_text(encoding='utf-8')
          needle = "  const event = project.event || {}\n"
          replacement = needle + "  const locationColor = /^#[0-9a-fA-F]{6}$/.test(String(event.locationColor || '')) ? String(event.locationColor) : '#ffffff'\n"
          if 'const locationColor =' not in text:
              if needle not in text:
                  raise SystemExit('Export target 1 not found')
              text = text.replace(needle, replacement, 1)
          needle = '<a href=\\\"${esc(event.ceremonyMapsUrl)}\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\">Ver ubicación</a>'
          replacement = '<a href=\\\"${esc(event.ceremonyMapsUrl)}\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\" style=\\\"color:${esc(locationColor)} !important;-webkit-text-fill-color:${esc(locationColor)} !important;\\\">Ver ubicación</a>'
          if needle not in text:
              raise SystemExit('Export ceremony target not found')
          text = text.replace(needle, replacement, 1)
          needle = '<a href=\\\"${esc(event.receptionMapsUrl)}\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\">Ver ubicación</a>'
          replacement = '<a href=\\\"${esc(event.receptionMapsUrl)}\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\" style=\\\"color:${esc(locationColor)} !important;-webkit-text-fill-color:${esc(locationColor)} !important;\\\">Ver ubicación</a>'
          if needle not in text:
              raise SystemExit('Export reception target not found')
          text = text.replace(needle, replacement, 1)
          output.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-location-color.yml
          git add src/creator/EditorWedding.jsx src/data/weddingSchema.js src/export/exportWedding.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: add shared event location color"
          git push
