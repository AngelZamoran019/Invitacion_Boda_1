name: Repair build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair syntax and build
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/export/weddingOutput.js')
          lines = p.read_text(encoding='utf-8').splitlines()
          replacement = '  const target = sections.find((section) => new RegExp("<p\\\\s+class=[\\\"\\\']eyebrow[\\\"\\\'][^>]*>\\\\s*" + escapedTitle + "\\\\s*</p>", \'i\').test(section))'
          for index, line in enumerate(lines):
              if line.strip().startswith('const target = sections.find((section) =>'):
                  lines[index] = replacement
                  break
          else:
              raise SystemExit('Target line was not found; no file changed.')
          p.write_text('\\n'.join(lines) + '\\n', encoding='utf-8')
          PY
          npm install
          npm run build
      - name: Commit repair and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/diagnose-build-push.yml .github/workflows/diagnose-build.yml || true
          git add src/export/weddingOutput.js
          git commit -m 'Corregir sintaxis de estilos de historia'
          git push
